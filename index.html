<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    button:disabled { opacity: .6; cursor: wait; }
    pre { white-space: pre-wrap; padding: .75rem; background: #f4f4f5; border-radius: .4rem; }
    #result { margin-top: 1rem; }
    .status-loading { color: #52606d; }
    .status-ok { color: #1b7f47; }
    .status-manual_review { color: #9a4b00; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form novalidate>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" required></textarea>
    <button id="submit" type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite"></section>
  <script type="module">
    import { loadingViewModel, manualViewModel, toViewModel } from "./ui.mjs";

    const form = document.querySelector("form");
    const field = document.querySelector("#message");
    const button = document.querySelector("#submit");
    const result = document.querySelector("#result");

    function render(view) {
      result.replaceChildren();

      const status = document.createElement("p");
      status.className = `status-${view.kind}`;
      status.textContent = view.message;
      result.append(status);

      if (view.kind === "ready") {
        const topic = document.createElement("p");
        topic.textContent = `Тема: ${view.topic}`;
        const draft = document.createElement("pre");
        draft.textContent = view.draft;
        result.append(topic, draft);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = field.value.trim();
      if (!text) {
        render(manualViewModel("Введите текст заявки — пустую заявку разобрать нельзя."));
        field.focus();
        return;
      }

      render(loadingViewModel());
      button.disabled = true;
      try {
        const response = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!response.ok) {
          render(manualViewModel("Сервер не принял заявку. Проверьте текст и попробуйте ещё раз."));
          return;
        }

        let reply;
        try {
          reply = await response.json();
        } catch {
          render(manualViewModel("Сервер вернул некорректный ответ. Разберите заявку вручную."));
          return;
        }
        render(toViewModel(reply));
      } catch {
        render(manualViewModel("Нет связи с сервисом. Разберите заявку вручную."));
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
